  </defs>
  <rect width="1600" height="420" rx="38" fill="url(#bg)"/>
  <rect x="2" y="2" width="1596" height="416" rx="36" fill="none" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="800" cy="210" r="330" fill="url(#glow)"/>
  <g opacity="0.75" fill="none" stroke="#8b5cf6" stroke-opacity="0.24">
    <path d="M70 315 C280 80 440 360 680 115" stroke-width="2"/>
    <path d="M980 105 C1180 340 1290 55 1540 280" stroke-width="2"/>
    <path d="M210 105 C380 260 490 80 625 300" stroke-width="1"/>
